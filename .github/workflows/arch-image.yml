name: Publish architecture-track image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free space for CUDA base image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker image prune -af
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/arch.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/ilblackdragon/delta-arch:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ilblackdragon/deltaleague
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test the harness inside the image (CPU)
        run: |
          docker run --rm --entrypoint python3 ghcr.io/ilblackdragon/delta-arch@${{ steps.build.outputs.digest }} \
            -I -c "import delta_cli.arch.harness, delta_cli.arch.worker, delta_cli.arch.baseline.delta_model; print('ok')"
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/ilblackdragon/delta-arch@$IMAGE_DIGEST" | tee arch-image.txt
          cat arch-image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-image
          path: arch-image.txt
